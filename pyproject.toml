[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-harness-codex-plugin"
version = "0.5.0"
description = "DeepSeek Harness automation and review tools for supervised coding workflows"
readme = "README.md"
license = "MIT"
authors = [
  { name = "oguricapkawaii" },
]
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.0.0,<3.0.0",
  "openai>=2.0.0,<3.0.0",
]

[project.scripts]
deepseek-coding-agent = "deepseek_coding_agent.server:main"

[project.urls]
Homepage = "https://github.com/oguricapkawaii/deepseek-harness-codex-plugin"
Repository = "https://github.com/oguricapkawaii/deepseek-harness-codex-plugin"
Issues = "https://github.com/oguricapkawaii/deepseek-harness-codex-plugin/issues"

[tool.setuptools.packages.find]
where = ["src"]
